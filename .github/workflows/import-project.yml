name: Import Factorio Mod Manager project

on:
  push:
    branches: [main]
    paths:
      - ".upload/READY"

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rebuild and extract project archive
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/part-* > /tmp/factorio-manager.b64
          base64 -d /tmp/factorio-manager.b64 > /tmp/FactorioModManager-Pro-SearchTab.zip
          rm -rf /tmp/factorio-import
          mkdir /tmp/factorio-import
          unzip -q /tmp/FactorioModManager-Pro-SearchTab.zip -d /tmp/factorio-import
          rm -f index.html
          cp -a /tmp/factorio-import/FactorioModManager-Pro/. .
          rm -rf .upload
          cat > .gitignore <<'EOF'
          __pycache__/
          *.py[cod]
          .venv/
          venv/
          manager-config.json
          profiles/
          backups/
          build/
          dist/
          *.log
          EOF
          rm -f .github/workflows/import-project.yml

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "feat: add Factorio Mod Manager Pro 2.1.0"
          git push
