name: Apply Factorio Mod Manager 3.0.0

on:
  push:
    paths:
      - '.github/workflows/apply-v300.yml'

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  PYTHONPATH: '.'

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v3.0.0 patch
        run: python .github/scripts/apply_v300.py

      - name: Update version-aware regression expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('tests/test_v250_optimization.py', 'tests/test_auto_restart_update.py'):
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              text = text.replace('version = "2.5.0"', 'version = "3.0.0"')
              text = text.replace('version = "2.4.2"', 'version = "3.0.0"')
              p.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: python -m pip install packaging requests flask 'flet[all]>=0.86.5,<0.87' pillow

      - name: Generate app icon
        run: python tools/generate_icon.py

      - name: Python syntax checks
        run: python -m py_compile manager.py factorio_settings.py process_restart.py app.py flet_app.py storage.py launcher.py app_version.py tools/generate_icon.py

      - name: Flet compatibility check
        run: |
          python - <<'PY'
          import inspect, flet as ft
          assert 'helper_text' not in inspect.signature(ft.TextField).parameters
          source = open('flet_app.py', encoding='utf-8').read()
          assert 'helper_text=' not in source
          print('Flet compatibility: PASS')
          PY

      - name: Core offline tests
        run: python tests/test_core_offline.py

      - name: Search offline tests
        run: python tests/test_search_offline.py

      - name: Settings editor tests
        run: python tests/test_settings_editor_offline.py

      - name: Auto restart updater tests
        run: python tests/test_auto_restart_update.py

      - name: v2.5 optimization regression tests
        run: python tests/test_v250_optimization.py

      - name: v3.0 release tests
        run: python tests/test_v300_release.py

      - name: JavaScript syntax check
        run: node --check static/app.js

      - name: Remove one-shot patch files
        run: |
          rm -f .github/scripts/apply_v300.py
          rm -f .github/workflows/apply-v300.yml

      - name: Commit tested v3.0.0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: release Factorio Mod Manager 3.0.0"
            git push origin HEAD:main
          fi

  build-windows-exe:
    needs: patch-test-commit
    runs-on: windows-latest
    steps:
      - name: Checkout tested main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pillow

      - name: Ensure icon assets
        run: python tools/generate_icon.py

      - name: Build single-file EXE
        shell: pwsh
        run: |
          flet pack flet_app.py --name FactorioModManager --icon assets/icon.ico --product-name "Factorio Mod Manager" --product-version "3.0.0" --file-version "3.0.0.0" --file-description "Factorio Mod Manager" --company-name "Community" --bundle-id "dev.factorio.modmanager" --yes

      - name: Smoke check artifact
        shell: pwsh
        run: |
          if (!(Test-Path "dist/FactorioModManager.exe")) { throw "EXE was not created" }
          $size = (Get-Item "dist/FactorioModManager.exe").Length
          if ($size -lt 1000000) { throw "EXE is unexpectedly small" }
          Write-Host "EXE size: $size bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: FactorioModManager-Windows-3.0.0
          path: dist/FactorioModManager.exe

      - name: Create GitHub Release v3.0.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v3.0.0 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create v3.0.0 dist/FactorioModManager.exe --target main --title "Factorio Mod Manager v3.0.0" --notes-file RELEASE_NOTES_3.0.0.md
          } else {
            gh release upload v3.0.0 dist/FactorioModManager.exe --clobber
          }
