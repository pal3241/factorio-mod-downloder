name: Apply Flet Compatibility Hotfix 2.4.1

on:
  push:
    paths:
      - '.github/workflows/apply-v241.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v2.4.1 patch
        run: python .github/scripts/apply_v241.py

      - name: Install dependencies
        run: python -m pip install packaging requests flask 'flet[all]>=0.86.5,<0.87'

      - name: Python syntax checks
        run: python -m py_compile manager.py factorio_settings.py app.py flet_app.py storage.py launcher.py

      - name: Flet TextField compatibility regression check
        run: |
          python - <<'PY'
          import inspect
          import flet as ft
          from pathlib import Path
          sig = inspect.signature(ft.TextField)
          assert 'helper_text' not in sig.parameters
          source = Path('flet_app.py').read_text(encoding='utf-8')
          assert 'helper_text=' not in source
          ft.TextField(label='test', value='1', dense=True)
          print('Flet TextField compatibility: PASS')
          PY

      - name: Core offline tests
        run: python tests/test_core_offline.py

      - name: Search offline tests
        run: python tests/test_search_offline.py

      - name: Real settings editor offline tests
        run: python tests/test_settings_editor_offline.py

      - name: JavaScript syntax check
        run: node --check static/app.js

      - name: Remove one-shot patch files
        run: |
          rm -f .github/scripts/apply_v241.py
          rm -f .github/workflows/apply-v241.yml

      - name: Commit tested v2.4.1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: support Flet 0.86 TextField in mod settings" || exit 0
          git push origin HEAD:main
