name: Apply Real Mod Settings Editor 2.4.0
# retry after settings editor test path fix

on:
  push:
    paths:
      - '.github/workflows/apply-v240.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v2.4.0 patch
        run: python .github/scripts/apply_v240.py

      - name: Python syntax checks
        run: |
          python -m py_compile manager.py factorio_settings.py app.py flet_app.py storage.py launcher.py

      - name: Install test dependencies
        run: python -m pip install packaging requests flask

      - name: Core offline tests
        run: python tests/test_core_offline.py

      - name: Search offline tests
        run: python tests/test_search_offline.py

      - name: Real settings editor offline tests
        run: python tests/test_settings_editor_offline.py

      - name: JavaScript syntax check
        run: node --check static/app.js

      - name: Remove one-shot patch files
        run: |
          rm -f .github/scripts/apply_v240.py
          rm -f .github/workflows/apply-v240.yml

      - name: Commit tested v2.4.0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: add real per-mod Factorio settings editor"
            git push origin HEAD:main
          fi
