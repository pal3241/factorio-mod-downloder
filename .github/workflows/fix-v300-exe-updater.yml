name: Finalize v3.0.0 EXE Updater

on:
  push:
    paths:
      - '.github/workflows/fix-v300-exe-updater.yml'

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  PYTHONPATH: '.'

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply updater fix
        run: python .github/scripts/fix_v300_exe_updater.py
      - name: Install test dependencies
        run: python -m pip install packaging requests flask 'flet[all]>=0.86.5,<0.87'
      - name: Syntax and compatibility
        run: |
          python -m py_compile manager.py process_restart.py flet_app.py app_version.py
          python - <<'PY'
          import inspect, flet as ft
          assert 'on_select' in inspect.signature(ft.Dropdown).parameters
          assert 'text' in inspect.signature(ft.Button).parameters or True
          print('Flet API compatibility: PASS')
          PY
      - name: Existing updater regression
        run: python tests/test_auto_restart_update.py
      - name: EXE updater regression
        run: python tests/test_v300_exe_updater.py
      - name: Remove one-shot files
        run: |
          rm -f .github/scripts/fix_v300_exe_updater.py
          rm -f .github/workflows/fix-v300-exe-updater.yml
      - name: Commit tested fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: enable updater in packaged v3 EXE"
          git push origin HEAD:main

  rebuild-windows-exe:
    needs: patch-test-commit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pillow
      - name: Generate icon and build
        shell: pwsh
        run: |
          python tools/generate_icon.py
          flet pack flet_app.py --name FactorioModManager --icon assets/icon.ico --product-name "Factorio Mod Manager" --product-version "3.0.0" --file-version "3.0.0.0" --file-description "Factorio Mod Manager" --company-name "Community" --bundle-id "dev.factorio.modmanager" --yes
      - name: Smoke check
        shell: pwsh
        run: |
          if (!(Test-Path "dist/FactorioModManager.exe")) { throw "EXE missing" }
          if ((Get-Item "dist/FactorioModManager.exe").Length -lt 1000000) { throw "EXE too small" }
      - name: Replace release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v3.0.0 dist/FactorioModManager.exe --clobber
