name: Apply Mod Settings and App Updater 2.3.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-v230.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply v2.3.0 patch
        run: python tools/apply_v230.py

      - name: Python syntax checks
        run: python -m py_compile manager.py flet_app.py app.py storage.py launcher.py doctor.py

      - name: Core offline tests
        run: python tests/test_core_offline.py

      - name: Search offline tests
        run: python tests/test_search_offline.py

      - name: App updater and mod settings offline tests
        run: python tests/test_app_update_offline.py

      - name: JavaScript syntax check
        run: node --check static/app.js

      - name: Commit tested v2.3.0
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/apply_v230.py
          rmdir tools 2>/dev/null || true
          rm -f .github/workflows/apply-v230.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add per-mod settings and self updater"
          git push
