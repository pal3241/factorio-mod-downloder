name: Apply Factorio Mod Manager 3.0.1

on:
  push:
    paths:
      - '.github/workflows/apply-v301.yml'

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  PYTHONPATH: '.'

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v3.0.1 patch
        run: python .github/scripts/apply_v301.py

      - name: Update version regression expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_auto_restart_update.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('version = "3.0.0"', 'version = "3.0.1"')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Python syntax checks
        run: python -m py_compile manager.py factorio_settings.py process_restart.py app.py flet_app.py storage.py launcher.py app_version.py tests/test_v301_color_desktop.py

      - name: Core offline tests
        run: python tests/test_core_offline.py

      - name: Search offline tests
        run: python tests/test_search_offline.py

      - name: Settings editor tests
        run: python tests/test_settings_editor_offline.py

      - name: App updater regression tests
        run: python tests/test_auto_restart_update.py

      - name: Optimization regression tests
        run: python tests/test_v250_optimization.py

      - name: v3 release regression tests
        run: python tests/test_v300_release.py

      - name: v3.0.1 color and desktop tests
        run: python tests/test_v301_color_desktop.py

      - name: JavaScript syntax check
        run: node --check static/app.js

      - name: Remove one-shot files
        run: |
          rm -f .github/scripts/apply_v301.py
          rm -f .github/workflows/apply-v301.yml

      - name: Commit tested v3.0.1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: release Factorio Mod Manager 3.0.1"
            git push origin HEAD:main
          fi

  build-windows-exe:
    needs: patch-test-commit
    runs-on: windows-latest
    steps:
      - name: Checkout tested main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pillow

      - name: Ensure icon assets
        run: python tools/generate_icon.py

      - name: Build single-file EXE
        shell: pwsh
        run: |
          flet pack flet_app.py --name FactorioModManager --icon assets/icon.ico --product-name "Factorio Mod Manager" --product-version "3.0.1" --file-version "3.0.1.0" --file-description "Factorio Mod Manager" --company-name "Community" --bundle-id "dev.factorio.modmanager" --yes

      - name: Smoke check artifact
        shell: pwsh
        run: |
          if (!(Test-Path "dist/FactorioModManager.exe")) { throw "EXE was not created" }
          $size = (Get-Item "dist/FactorioModManager.exe").Length
          if ($size -lt 1000000) { throw "EXE is unexpectedly small" }
          Write-Host "EXE size: $size bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: FactorioModManager-Windows-3.0.1
          path: dist/FactorioModManager.exe

      - name: Create GitHub Release v3.0.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v3.0.1 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create v3.0.1 dist/FactorioModManager.exe --target main --title "Factorio Mod Manager v3.0.1" --notes-file RELEASE_NOTES_3.0.1.md
          } else {
            gh release upload v3.0.1 dist/FactorioModManager.exe --clobber
          }
